<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蜆湯｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s3e07-shijimi-soup">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>平賀夫婦一早來店裡吃早餐，喝了蜆湯。兩人是在國中同學會重逢後才結婚的。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>蜆<span>150 公克</span></li>
        <li>水<span>1 又 1/2 碗</span></li>
        <li>味噌<span>1 大匙</span></li>
        <li>蔥花<span>少許</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>蜆泡淡鹽水吐沙 2 小時，搓洗乾淨。</li>
        <li>蜆和冷水一起下鍋，開中火煮到全部開口，撈掉浮沫。</li>
        <li>轉小火，把味噌化進湯裡。</li>
        <li>快滾之前關火，撒上蔥花。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>蜆要從冷水開始煮，鮮味才出得來。</li>
        <li>放了味噌就不要再煮滾，香氣會跑掉。</li>
        <li>製作時間不含吐沙。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
