<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>章魚紅香腸｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s2e01-red-wiener-again">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>黑道的阿龍一向愛吃老闆的紅香腸。高中棒球隊的老同學、刑警野口來找他，邀他去探望住院的前球隊經理。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>紅色小香腸<span>6 條</span></li>
        <li>沙拉油<span>1 小匙</span></li>
        <li>高麗菜絲<span>少許</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>香腸從中間往一端直切三刀，切成八隻腳。</li>
        <li>平底鍋加油開中火，放入香腸。</li>
        <li>邊煎邊滾動，煎到腳向外翹開。</li>
        <li>盛盤，旁邊放高麗菜絲。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>刀口切到香腸的一半長度就好，太深容易斷。</li>
        <li>火不要太大，表面微焦即可。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
