<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒蒸蛤蜊｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s2e03-asari-sakamushi">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>一位愛喝酒的老太太總是配著酒蒸蛤蜊一杯接一杯，老闆勸也不聽。喝醉了，就由兒子阿丈揹她回家。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>蛤蜊<span>300 公克</span></li>
        <li>清酒或米酒<span>3 大匙</span></li>
        <li>蒜頭<span>1 瓣</span></li>
        <li>蔥花<span>1 大匙</span></li>
        <li>醬油<span>幾滴</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>蛤蜊泡鹽水吐沙 2 小時，互相搓洗乾淨。</li>
        <li>鍋裡放入蛤蜊、蒜片與酒，蓋上鍋蓋開中火。</li>
        <li>燜 3 到 4 分鐘，蛤蜊全部開口就關火。</li>
        <li>滴幾滴醬油，撒上蔥花。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>開口就要關火，煮久了肉會縮。</li>
        <li>蛤蜊本身有鹹味，先嚐湯再決定要不要加醬油。</li>
        <li>製作時間不含吐沙。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
