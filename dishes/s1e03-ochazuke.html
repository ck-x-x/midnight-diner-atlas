<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>茶泡飯｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s1e03-ochazuke">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>三位總是一起來的女性常客，每次都各點一碗茶泡飯，口味永遠是梅子、鮭魚和鱈魚子，老闆私下叫她們「茶泡飯三姊妹」。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>白飯<span>1 碗</span></li>
        <li>配料（梅子、烤鮭魚或鱈魚子擇一）<span>適量</span></li>
        <li>海苔絲<span>少許</span></li>
        <li>蔥花或鴨兒芹<span>少許</span></li>
        <li>山葵<span>少許</span></li>
        <li>熱綠茶或日式高湯<span>約 150 毫升</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>白飯盛入碗中，放上選好的配料。</li>
        <li>撒上海苔絲和蔥花，碗邊放一點山葵。</li>
        <li>要吃之前才沖入熱茶或高湯，淹到飯的八分滿。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>茶太早倒，飯會吸水變糊，上桌前再沖。</li>
        <li>用冷飯也可以，先用熱水沖過瀝乾，口感比較清爽。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
