<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豬五花番茄捲｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s3e02-pork-tomato-rolls">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>漫畫編輯宇野帶著剛拿下新人獎的漫畫家橋本來店裡，點了豬五花番茄捲請他吃。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>小番茄<span>6 顆</span></li>
        <li>豬五花薄片<span>6 片</span></li>
        <li>鹽、黑胡椒<span>少許</span></li>
        <li>沙拉油<span>1 小匙</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>小番茄去蒂，每顆用一片豬五花捲緊。</li>
        <li>三顆串成一串，撒鹽和黑胡椒。</li>
        <li>平底鍋加油開中火，收口朝下放入。</li>
        <li>邊煎邊轉動，煎到整圈金黃，約 6 分鐘。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>收口先朝下煎，肉片就不會鬆開。</li>
        <li>番茄裡面很燙，放一下再咬。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
