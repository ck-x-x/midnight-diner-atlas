<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>紅薑天婦羅｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s3e04-benishoga-tempura">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>一位從大阪來的女孩，請老闆把紅薑炸成天婦羅，那是她在大阪吃慣的平民味道。常客小道對她很有好感。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>紅薑絲<span>50 公克</span></li>
        <li>麵粉<span>3 大匙</span></li>
        <li>太白粉<span>1 大匙</span></li>
        <li>冰水<span>3 大匙</span></li>
        <li>炸油<span>適量</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>紅薑絲用紙巾壓乾水分。</li>
        <li>麵粉、太白粉加冰水，用筷子大略拌幾下。</li>
        <li>把紅薑拌進麵糊，用湯匙舀成小片。</li>
        <li>滑入 170 度的油鍋，炸到兩面酥脆，約 2 分鐘。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>紅薑的水分要壓乾，不然會油爆。</li>
        <li>麵糊不要拌太久，有一點粉粒沒關係。</li>
        <li>紅薑本身夠鹹，不必再沾醬。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
