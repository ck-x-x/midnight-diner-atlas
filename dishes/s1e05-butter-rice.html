<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奶油飯｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s1e05-butter-rice">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>常客帶了一位講究的美食評論家來店裡。正當他大談名店料理時，流浪歌手五郎走進門，點了一碗樸素的奶油飯。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>剛煮好的白飯<span>1 碗</span></li>
        <li>奶油<span>10 公克</span></li>
        <li>醬油<span>幾滴</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>盛一碗剛煮好的熱白飯。</li>
        <li>在飯中間挖一個小洞，把奶油埋進去，蓋上飯。</li>
        <li>等大約 30 秒讓奶油融化。</li>
        <li>滴上幾滴醬油，拌勻後趁熱吃。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>醬油只要幾滴，目的是提香，不是調鹹。</li>
        <li>用有鹽奶油味道比較完整。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
