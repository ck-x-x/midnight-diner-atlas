<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>貓飯｜深夜食堂料理圖鑑</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-root=".." data-id="s1e02-neko-manma">
  <header class="site-header" id="site-header"></header>

  <main class="page">
    <div id="dish-hero"></div>
    <section id="story">
      <h2>劇中登場</h2>
      <p>一位還沒走紅的演歌歌手深夜來到店裡，點了她最喜歡的貓飯：白飯、柴魚片，加一點醬油。</p>
    </section>

    <section id="ingredients">
      <h2>材料（1 人份）</h2>
      <ul class="ingredients">
        <li>熱白飯<span>1 碗</span></li>
        <li>柴魚片<span>1 小把</span></li>
        <li>醬油<span>1 小匙</span></li>
      </ul>
    </section>

    <section id="steps">
      <h2>做法</h2>
      <ol class="steps">
        <li>盛一碗剛煮好的熱白飯。</li>
        <li>把柴魚片鋪滿在飯上，讓熱氣把它蒸軟。</li>
        <li>沿著碗邊淋上醬油，稍微拌一下就可以吃。</li>
      </ol>
    </section>

    <section id="tips">
      <h2>小訣竅</h2>
      <ul>
        <li>飯一定要熱，柴魚片的香氣才會出來。</li>
        <li>醬油寧少勿多，不夠再加。</li>
      </ul>
    </section>
    <div id="dish-links"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="../data/dishes.js"></script>
  <script src="../assets/site.js"></script>
</body>
</html>
